<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Destindere • Congregația Orhei-Vest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">

<style>
.gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.gallery-card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);min-height:220px;position:relative}.gallery-card img{width:100%;height:220px;object-fit:cover}.gallery-missing{position:absolute;inset:0;display:none;place-items:center;background:linear-gradient(135deg,#fff8ef,#f5e8d8);color:#9a6b45}.gallery-missing span{font-size:3rem;display:block}.gallery-missing small{display:block;text-align:center}.map iframe{min-height:460px}.upload-card{max-width:760px;margin:auto;text-align:center;background:#fff;padding:42px;border-radius:28px;box-shadow:var(--shadow)}.memories-text{text-align:center}.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.food-card{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--shadow)}.food-card-icon{font-size:2rem}.food-progress{height:10px;background:#eee;border-radius:999px;overflow:hidden}.food-progress-bar{height:100%;background:#b45309}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.stat-card{background:#fff;border-radius:18px;padding:20px;text-align:center}.stat-card span{font-size:2rem;font-weight:700}.product-row{display:grid;grid-template-columns:1fr 140px;gap:10px;margin-bottom:10px}@media(max-width:900px){.gallery-grid,.food-grid,.stats-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.gallery-grid,.food-grid,.stats-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="leaves"></div>
<header><nav class="container"><div class="logo" id="navLogo">🍂 Orhei-Vest</div><ul id="mainNav"></ul></nav></header>
<main id="app"></main>
<footer><p id="footerText"></p></footer>
<script src="./config.js"></script>
<script src="./assets/js/site.js"></script>
<script src="./assets/js/upload.js"></script>
<script src="./assets/js/google-sheet.js"></script>
</body>
</html>
