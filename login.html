<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Destindere • Autentificare</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,sans-serif;background:linear-gradient(135deg,#f7f3ee,#fff8ef);color:#2f2f2f}.card{width:min(92%,440px);background:#fff;padding:38px;border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.12)}.logo{text-align:center;font-size:3rem}.eyebrow{text-align:center;color:#8b4513;font-size:.8rem;font-weight:700;letter-spacing:1.5px}.card h1{text-align:center;margin:8px 0}.sub{text-align:center;color:#6b7280;font-size:.9rem;margin-bottom:28px}.field{display:block;margin:16px 0;font-size:.9rem;font-weight:600}.field input{width:100%;margin-top:7px;padding:14px 16px;border:1px solid #ddd;border-radius:13px;font:inherit}.primary{width:100%;border:0;padding:15px;border-radius:999px;background:linear-gradient(135deg,#d97706,#fbbf24);color:#fff;font-weight:700;cursor:pointer}.message{text-align:center;min-height:24px;margin-top:15px;font-size:.9rem}.note{text-align:center;color:#8c8177;font-size:.72rem;margin-top:24px}
</style></head>
<body><div class="card"><div class="logo">🍂</div><div class="eyebrow">DESTINDERI JW MOLDOVA</div><h1>Bine ai venit</h1><p class="sub">Introdu numele, prenumele și congregația pentru a continua.</p>
<form id="loginForm">
<label class="field">Nume<input id="loginNume" required></label>
<label class="field">Prenume<input id="loginPrenume" required></label>
<label class="field">Congregația<input id="loginCongregatie" required></label>
<button class="primary" type="submit">INTRĂ</button><div id="loginMessage" class="message"></div>
</form><p class="note">Datele sunt verificate în Google Sheets TEST. Sesiunea este păstrată local pe acest dispozitiv.</p>
</div><script src="./config.js"></script><script src="./assets/js/login.js"></script></body></html>
